<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sicherer LogIn</title>
</head>
<body>
    <input id="guessInput" type="password">
    <br>
    <span id="realatyOutput"></span>
    <script>
        const guessInput = document.getElementById('guessInput');
        const realatyOutput = document.getElementById('realatyOutput');
        
        let password = crypto.randomUUID();
        let output = ''

        guessInput.addEventListener('input',guess);
        document.body.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                output = output.replace('|','');

                let start = output.slice(0,guessInput.selectionStart);
                let end = output.slice(guessInput.selectionStart);

                output = start + '|' + end;
                realatyOutput.innerText = output;
            }
        });

        function guess() {
            console.time('debug');
            console.log('Es wird geraten!');
            let guess = guessInput.value;
            output = '';

            guess = guess.split('');
            console.log(guess);

            let index = 0;

            guess.forEach(e => {
                if(password.split('')[index] === e){
                    output += '✅';
                } else if(password.split('')[index].toLowerCase() == e.toLowerCase()) {
                    output += '⬆️';
                } else if(password.split('').includes(e)) {
                    output += '➖';
                } else {
                    output += '❌';
                }
                console.log({
                    "index": index,
                    "output": output,
                    "e": e,
                    "password[index]": password.split('')[index],
                });
                index++;
                console.timeStamp('debug');
            });

            if(guess.join('') === password) {
                alert('Well done');
                realatyOutput.innerText = 'Correct'
            }
            realatyOutput.innerText = output;
            console.timeEnd('debug');
        }
    </script>
  <!-- Maby Styling is comming soon -->
</body>
</html>
